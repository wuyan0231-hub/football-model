name: 足球全面特征：补采、训练、未来对照与确认

on:
  push:
    branches: [codex/s3-r11-complete]
    paths:
      - 'football_model/advanced_*.py'
      - 'football_model/cold_start.py'
      - 'football_model/feature_decisions.py'
      - 'football_model/feature_schedule.py'
      - 'football_model/state_storage.py'
      - 'football_model/history_archive.py'
      - 'football_model/research_checkpoints.py'
      - 'scripts/cloud_state.py'
      - 'scripts/export_advanced_evidence.py'
      - 'scripts/advanced_study_window.py'
      - 'advanced-models-domestic-v1.json'
      - 'advanced-confirmation-v1.json'
      - 'tests/test_advanced*.py'
      - '.github/workflows/advanced-models.yml'
  workflow_dispatch:
    inputs:
      research_only:
        description: '只续跑已保存资料的研究；跳过赛前捕获与采集评分'
        required: false
        type: boolean
        default: false
      short_only:
        description: '仅在main执行完整短轮；与research_only互斥，不重跑历史研究'
        required: false
        type: boolean
        default: false
      research_leagues:
        description: '仅main研究续跑可选剩余16联赛；最终核全部18个现行国内联赛原件'
        required: false
        type: choice
        default: all
        options:
          - all
          - remaining_after_epl_championship
  schedule:
    - cron: '10,40 * * * *'
    - cron: '7 2 * * *'

permissions:
  contents: write
  actions: read

jobs:
  validate_dispatch:
    if: >-
      github.repository == 'wuyan0231-hub/football-model' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 验证手动模式互斥与短轮分支
        env:
          RESEARCH_ONLY: ${{ inputs.research_only }}
          SHORT_ONLY: ${{ inputs.short_only }}
          DISPATCH_REF: ${{ github.ref }}
          RESEARCH_LEAGUES: ${{ inputs.research_leagues || 'all' }}
        run: |
          if [ "$RESEARCH_ONLY" = true ] && [ "$SHORT_ONLY" = true ]; then
            echo '::error::research_only与short_only不能同时启用'
            exit 1
          fi
          if [ "$SHORT_ONLY" = true ] && [ "$DISPATCH_REF" != refs/heads/main ]; then
            echo '::error::short_only仅允许在main执行'
            exit 1
          fi
          selection="${RESEARCH_LEAGUES:-all}"
          case "$selection" in
            all|remaining_after_epl_championship) ;;
            *) echo '::error::未知研究联赛范围'; exit 1 ;;
          esac
          if [ "$selection" != all ] && { [ "$RESEARCH_ONLY" != true ] || [ "$SHORT_ONLY" = true ] || [ "$DISPATCH_REF" != refs/heads/main ]; }; then
            echo '::error::剩余联赛范围仅允许main的research_only手动续跑'
            exit 1
          fi
  verify:
    if: >-
      github.repository == 'wuyan0231-hub/football-model' &&
      !(github.event_name == 'workflow_dispatch' && inputs.short_only == true) &&
      (github.event_name != 'schedule' || vars.ENABLE_SCHEDULE == 'true') &&
      (github.event_name != 'schedule' || github.event.schedule == '7 2 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 一次完整回归与真实R依赖检查
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-jsonlite
          Rscript --vanilla -e 'stopifnot(requireNamespace("jsonlite", quietly=TRUE))'
          python -m unittest discover -s tests -v
  pre_study_capture:
    needs: validate_dispatch
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'football-model-state' || format('football-model-research-{0}', github.ref) }}
      cancel-in-progress: false
      queue: max
    if: >-
      !cancelled() && (github.event_name != 'workflow_dispatch' || needs.validate_dispatch.result == 'success') &&
      github.repository == 'wuyan0231-hub/football-model' && github.ref == 'refs/heads/main' &&
      !(github.event_name == 'workflow_dispatch' && (inputs.research_only == true || inputs.short_only == true)) &&
      (github.event_name != 'schedule' || vars.ENABLE_SCHEDULE == 'true') &&
      (github.event_name != 'schedule' || github.event.schedule == '7 2 * * *')
    runs-on: ubuntu-latest
    # Full-state restore/check/save is already over 30 minutes at ~7 GiB.
    # Give persistence a bounded 90-minute envelope; keep its success gate.
    timeout-minutes: 90
    outputs:
      restore_outcome: ${{ steps.restore.outcome }}
      persist_outcome: ${{ steps.persist.outcome }}
      durable_outcome: ${{ steps.durable.outcome }}
      facts_outcome: ${{ steps.facts.outcome }}
      confirmation_outcome: ${{ steps.confirmation.outcome }}
      capture_outcome: ${{ steps.capture.outcome }}
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: 恢复完整固定状态
        id: restore
        run: |
          python scripts/cloud_state.py load --runtime runtime
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          directory=Path(subprocess.check_output(['git','rev-parse','--absolute-git-dir'],text=True).strip())
          marker=json.loads((directory/'football-cloud-state.json').read_text())
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
              f.write('ADVANCED_PARENT_STATE='+str(marker.get('state_oid') or '')+'\n')
          PY
      - name: 长任务前验证已保存原件
        id: durable
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m football_model.advanced_durability --runtime runtime --state-commit "$ADVANCED_PARENT_STATE"
      - name: 长任务前同步真实信息
        id: facts
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.collect_fundamentals --runtime runtime --config config.json --league all --horizon-hours 11 --recent-matches 5
      - name: 长任务前检查确认准入
        id: confirmation
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m football_model.advanced_confirmation --runtime runtime --league all --advanced-protocol advanced-models-domestic-v1.json --protocol advanced-confirmation-v1.json --auto-activate
      - name: 长任务前捕获现有合法候选
        id: capture
        continue-on-error: true
        run: python -m football_model.advanced_snapshots capture --runtime runtime --league all --protocol advanced-models-domestic-v1.json --source-commit "$GITHUB_SHA" --state-commit "$ADVANCED_PARENT_STATE"
      - name: 立即保存赛前原件并结束独立短任务
        id: persist
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python scripts/cloud_state_save_once.py --runtime runtime --preflight-report advanced-preflight.json --receipt advanced-pre-study-save-run-receipt.json
      - name: 捕获与保存错误保持失败
        if: >-
          !cancelled() && (steps.restore.outcome != 'success' || steps.durable.outcome != 'success' ||
          steps.facts.outcome != 'success' || steps.confirmation.outcome != 'success' ||
          steps.capture.outcome != 'success' || steps.persist.outcome != 'success')
        run: exit 1
  advanced:
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'football-model-state' || format('football-model-research-{0}', github.ref) }}
      cancel-in-progress: false
      queue: max
    needs: [pre_study_capture, verify, validate_dispatch]
    if: >-
      !cancelled() && (github.event_name != 'workflow_dispatch' || needs.validate_dispatch.result == 'success') &&
      !(github.event_name == 'workflow_dispatch' && inputs.research_only == true && inputs.short_only == true) &&
      !(github.event_name == 'workflow_dispatch' && inputs.short_only == true && github.ref != 'refs/heads/main') &&
      (needs.verify.result == 'success' ||
      (needs.verify.result == 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.research_only == true))) &&
      (needs.pre_study_capture.result == 'skipped' ||
      (needs.pre_study_capture.outputs.restore_outcome == 'success' &&
      needs.pre_study_capture.outputs.persist_outcome == 'success')) &&
      github.repository == 'wuyan0231-hub/football-model' &&
      (github.event_name != 'schedule' || vars.ENABLE_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ ((github.event_name != 'schedule' || github.event.schedule == '7 2 * * *') && !(github.event_name == 'workflow_dispatch' && inputs.short_only == true)) && 180 || 110 }}
    outputs:
      restore_outcome: ${{ steps.restore.outcome }}
      persist_outcome: ${{ steps.persist.outcome }}
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      IS_RELEASE: ${{ github.ref == 'refs/heads/main' }}
      STUDY_RUN: ${{ (github.event_name != 'schedule' || github.event.schedule == '7 2 * * *') && !(github.event_name == 'workflow_dispatch' && inputs.short_only == true) }}
      LEGACY_SHORT_RUN: ${{ (github.event_name == 'schedule' && github.event.schedule != '7 2 * * *') || (github.event_name == 'workflow_dispatch' && inputs.short_only == true) }}
      RESEARCH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.research_only == true }}
      SHORT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.short_only == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: 恢复完整固定状态
        id: restore
        run: python scripts/cloud_state.py load --runtime runtime
      - name: 登记真实父状态
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          directory=Path(subprocess.check_output(['git','rev-parse','--absolute-git-dir'],text=True).strip())
          marker=json.loads((directory/'football-cloud-state.json').read_text())
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
              f.write('ADVANCED_PARENT_STATE='+str(marker.get('state_oid') or '')+'\n')
          Path('advanced-run-parent.json').write_text(json.dumps({k:v for k,v in marker.items() if k in ['source_sha','state_oid','loaded_at']},indent=2))
          PY
      - name: 验证已恢复赛前原件的远端保存证据
        id: durable
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m football_model.advanced_durability --runtime runtime --state-commit "$ADVANCED_PARENT_STATE"
      - name: 全部国内联赛跨赛事赛程公平续采
        id: club_schedule_collection
        if: env.IS_RELEASE == 'true' && env.STUDY_RUN == 'true' && env.RESEARCH_ONLY != 'true'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.feature_schedule --runtime runtime --config config.json --league all --source-commit "$GITHUB_SHA" --max-run-seconds 600 --reserve-requests 1500 --current-cache-seconds 21600
      - name: 优先补齐意甲机会和球员历史
        id: pilot_collection
        if: env.IS_RELEASE == 'true' && env.STUDY_RUN == 'true' && env.RESEARCH_ONLY != 'true'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.advanced_collection --runtime runtime --league serie_a --max-seconds 1200 --reserve-requests 700
      - name: 跨联赛断点续采与覆盖登记
        id: collection
        if: env.IS_RELEASE == 'true' && env.STUDY_RUN == 'true' && env.RESEARCH_ONLY != 'true'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.advanced_collection --runtime runtime --league all --max-seconds 600 --reserve-requests 500
      - name: 工程分支安装真实R
        if: env.STUDY_RUN == 'true' && env.IS_RELEASE != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-jsonlite
          Rscript --vanilla -e 'stopifnot(requireNamespace("jsonlite", quietly=TRUE))'
      - name: 各联赛独立研究与真实R拟合
        id: research
        if: env.STUDY_RUN == 'true' && env.IS_RELEASE != 'true'
        continue-on-error: true
        run: python scripts/advanced_study_window.py --selection all -- python -m football_model.advanced_research study --runtime runtime --league all --protocol advanced-models-domestic-v1.json --source-commit "$GITHUB_SHA" --state-commit "$ADVANCED_PARENT_STATE" --run-goalmodel
      - name: 同步全部联赛未来11小时的真实信息
        id: facts
        if: env.IS_RELEASE == 'true' && env.RESEARCH_ONLY != 'true'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.collect_fundamentals --runtime runtime --config config.json --league all --horizon-hours 11 --recent-matches 5
      - name: 检查独立确认准入与到期评估
        id: confirmation
        if: env.IS_RELEASE == 'true' && env.RESEARCH_ONLY != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m football_model.advanced_confirmation --runtime runtime --league all --advanced-protocol advanced-models-domestic-v1.json --protocol advanced-confirmation-v1.json --auto-activate
      - name: 捕获真实双时点全部候选
        id: capture
        if: env.IS_RELEASE == 'true' && env.RESEARCH_ONLY != 'true'
        continue-on-error: true
        run: python -m football_model.advanced_snapshots capture --runtime runtime --league all --protocol advanced-models-domestic-v1.json --source-commit "$GITHUB_SHA" --state-commit "$ADVANCED_PARENT_STATE"
      # Reuse the all-league facts above and the same loaded parent state. The
      # legacy protocols retain their own namespaces, first outputs and failures.
      - name: 同轮冻结原v1真实双时点
        id: legacy_capture_v1
        if: env.IS_RELEASE == 'true' && env.LEGACY_SHORT_RUN == 'true'
        continue-on-error: true
        run: python -m football_model.feature_snapshots capture --runtime runtime --config config.json --league serie_a --source-commit "$GITHUB_SHA" --state-commit "$ADVANCED_PARENT_STATE" --protocol feature-models.json
      - name: 同轮冻结原v2原件重建与双时点
        id: legacy_capture_v2
        if: env.IS_RELEASE == 'true' && env.LEGACY_SHORT_RUN == 'true'
        continue-on-error: true
        run: python -m football_model.feature_snapshots capture --runtime runtime --config config.json --league serie_a --source-commit "$GITHUB_SHA" --state-commit "$ADVANCED_PARENT_STATE" --protocol feature-models-v2.json
      - name: 独立结果与完整请求评分
        id: scoring
        if: env.IS_RELEASE == 'true' && env.RESEARCH_ONLY != 'true'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.advanced_scoring score --runtime runtime --league all --protocol advanced-models-domestic-v1.json --source-commit "$GITHUB_SHA"
      - name: 同轮原v1独立赛果与候选评分
        id: legacy_scoring_v1
        if: env.IS_RELEASE == 'true' && env.LEGACY_SHORT_RUN == 'true'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.feature_scoring score --runtime runtime --config config.json --league serie_a --source-commit "$GITHUB_SHA" --protocol feature-models.json
      - name: 同轮原v2全机会评分与基线回退
        id: legacy_scoring_v2
        if: env.IS_RELEASE == 'true' && env.LEGACY_SHORT_RUN == 'true'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.feature_scoring score --runtime runtime --config config.json --league serie_a --source-commit "$GITHUB_SHA" --protocol feature-models-v2.json
      - name: 核验存储与完整性
        id: check
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/cloud_state.py check --runtime runtime
      - name: 保存所有成果与失败记录
        id: persist
        if: ${{ !cancelled() && env.IS_RELEASE == 'true' && steps.check.outcome == 'success' }}
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python scripts/cloud_state_save_once.py --runtime runtime --preflight-report advanced-preflight.json --receipt advanced-main-save-run-receipt.json
      - name: 保存逐步骤事实回执
        if: always()
        env:
          RESTORE: ${{ steps.restore.outcome }}
          DURABLE: ${{ steps.durable.outcome }}
          PRE_STUDY_CAPTURE: ${{ needs.pre_study_capture.result }}
          PRE_RESTORE: ${{ needs.pre_study_capture.outputs.restore_outcome }}
          PRE_PERSIST: ${{ needs.pre_study_capture.outputs.persist_outcome }}
          PRE_DURABLE: ${{ needs.pre_study_capture.outputs.durable_outcome }}
          PRE_FACTS: ${{ needs.pre_study_capture.outputs.facts_outcome }}
          PRE_CONFIRMATION: ${{ needs.pre_study_capture.outputs.confirmation_outcome }}
          PRE_CAPTURE: ${{ needs.pre_study_capture.outputs.capture_outcome }}
          CLUB_SCHEDULE_COLLECTION: ${{ steps.club_schedule_collection.outcome }}
          PILOT_COLLECTION: ${{ steps.pilot_collection.outcome }}
          COLLECTION: ${{ steps.collection.outcome }}
          RESEARCH: ${{ steps.research.outcome }}
          FACTS: ${{ steps.facts.outcome }}
          CONFIRMATION: ${{ steps.confirmation.outcome }}
          CAPTURE: ${{ steps.capture.outcome }}
          SCORING: ${{ steps.scoring.outcome }}
          LEGACY_CAPTURE_V1: ${{ steps.legacy_capture_v1.outcome }}
          LEGACY_CAPTURE_V2: ${{ steps.legacy_capture_v2.outcome }}
          LEGACY_SCORING_V1: ${{ steps.legacy_scoring_v1.outcome }}
          LEGACY_SCORING_V2: ${{ steps.legacy_scoring_v2.outcome }}
          CHECK: ${{ steps.check.outcome }}
          PERSIST: ${{ steps.persist.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          keys=['GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','ADVANCED_PARENT_STATE','IS_RELEASE','STUDY_RUN','LEGACY_SHORT_RUN','RESEARCH_ONLY','SHORT_ONLY','RESTORE','DURABLE','PRE_STUDY_CAPTURE','PRE_RESTORE','PRE_PERSIST','PRE_DURABLE','PRE_FACTS','PRE_CONFIRMATION','PRE_CAPTURE','CLUB_SCHEDULE_COLLECTION','PILOT_COLLECTION','COLLECTION','RESEARCH','FACTS','CONFIRMATION','CAPTURE','SCORING','LEGACY_CAPTURE_V1','LEGACY_CAPTURE_V2','LEGACY_SCORING_V1','LEGACY_SCORING_V2','CHECK','PERSIST']
          receipt={k:os.environ.get(k) for k in keys}
          if receipt['IS_RELEASE']=='true' and receipt['LEGACY_SHORT_RUN']=='true':
              legacy={k:receipt[k] for k in ['GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','IS_RELEASE','STUDY_RUN']}
              legacy.update(FEATURE_PARENT_STATE=receipt['ADVANCED_PARENT_STATE'],
                  RESTORE_OUTCOME=receipt['RESTORE'],SCHEDULE_OUTCOME='skipped',
                  RESEARCH_OUTCOME='skipped',RESEARCH_V2_OUTCOME='skipped',
                  FACTS_OUTCOME=receipt['FACTS'],CAPTURE_OUTCOME=receipt['LEGACY_CAPTURE_V1'],
                  CAPTURE_V2_OUTCOME=receipt['LEGACY_CAPTURE_V2'],SCORING_OUTCOME=receipt['LEGACY_SCORING_V1'],
                  SCORING_V2_OUTCOME=receipt['LEGACY_SCORING_V2'],CHECK_OUTCOME=receipt['CHECK'],
                  PERSIST_OUTCOME=receipt['PERSIST'],confirmation_active=False,production_promoted=False,
                  source_workflow='advanced-models.yml',dispatch_mode='shared_short_cycle',facts_scope='all')
              Path('feature-run-receipt.json').write_text(json.dumps(legacy,indent=2))
              Path('feature-run-parent.json').write_bytes(Path('advanced-run-parent.json').read_bytes())
              receipt['legacy_short_cycle_receipt']='feature-run-receipt.json'
          import hashlib
          club_path=Path('runtime/feature_models/schedules/collection/latest.json')
          if club_path.is_file():
              raw=club_path.read_bytes(); club=json.loads(raw)
              receipt['club_schedule_report']={'path':str(club_path),'sha256':hashlib.sha256(raw).hexdigest(),
                  'execution_status':club.get('execution_status'),'full_collection_completed':club.get('full_collection_completed'),
                  'configured_domestic_leagues':club.get('configured_domestic_leagues'),
                  'completed_leagues':club.get('completed_leagues'),'deferred_leagues':club.get('deferred_leagues'),
                  'failed_leagues':club.get('failed_leagues'),'last_attempted_league':club.get('last_attempted_league'),
                  'api_requests':club.get('api_requests')}
          receipt['full_club_schedule_collection_completed']=receipt['CLUB_SCHEDULE_COLLECTION']=='success' and receipt.get('club_schedule_report',{}).get('full_collection_completed') is True
          reports={}
          for selection in ['serie_a','all']:
              path=Path('runtime/advanced_features/collection/by_selection')/selection/'latest.json'
              if path.is_file():
                  raw=path.read_bytes(); report=json.loads(raw)
                  reports[selection]={'path':str(path),'sha256':hashlib.sha256(raw).hexdigest(),'report':report}
          all_report=reports.get('all',{}).get('report',{})
          receipt.update(production_promoted=False,accuracy_improvement_verified=False,collection_reports=reports,
                         full_collection_completed=receipt['COLLECTION']=='success' and all_report.get('full_collection_completed') is True)
          from scripts.advanced_study_window import current_report
          binding=current_report(receipt['RESEARCH'],'all')
          receipt['research_report_binding']={k:v for k,v in binding.items() if k!='report'}
          if binding['status']=='current_report_verified':
              study=binding['report']
              receipt['research_report']={'path':binding['path'],'sha256':binding['sha256'],
                  'research_full_completed':study.get('research_full_completed'),
                  'requested_leagues':len(study.get('configured_leagues',[])),
                  'completed_leagues':study.get('completed_leagues'),
                  'calculation_completed_leagues':study.get('calculation_completed_leagues'),
                  'durable_completed_leagues':study.get('durable_completed_leagues'),
                  'stored_verified_completed_leagues':study.get('stored_verified_completed_leagues'),
                  'stored_research_durable_full_completed':study.get('stored_research_durable_full_completed'),
                  'current_inputs_match_leagues':study.get('current_inputs_match_leagues'),
                  'current_refit_required_leagues':study.get('current_refit_required_leagues'),
                  'resumed_leagues':study.get('resumed_leagues'),
                  'pending_leagues':study.get('pending_leagues'),
                  'deferred_leagues':study.get('capacity_deferred_leagues'),
                  'failed_leagues':sum(r.get('status')=='failed' for r in study.get('results',[]))}
          receipt['research_dispatch_mode']='per_league_locked_jobs' if receipt['IS_RELEASE']=='true' and receipt['STUDY_RUN']=='true' else 'local_or_short_cycle'
          receipt['research_full_completed']=receipt['RESEARCH']=='success' and receipt.get('research_report',{}).get('research_full_completed') is True
          player_reports=[]
          for path in Path('runtime/advanced_features/player_load/manifests').glob('*.json'):
              raw=path.read_bytes(); value=json.loads(raw)
              player_reports.append((value.get('finished_at',''),path,raw,value))
          if player_reports:
              _,path,raw,value=max(player_reports,key=lambda item:(item[0],str(item[1])))
              receipt['player_load_report']={'path':str(path),'sha256':hashlib.sha256(raw).hexdigest(),
                  'scope':value.get('scope'),'full_collection_completed':value.get('full_collection_completed'),
                  'execution_status':value.get('execution_status'),'detail_counts':value.get('detail_counts'),
                  'pending_requests':len(value.get('pending_requests',[])),'api_requests':value.get('api_requests')}
          Path('advanced-run-receipt.json').write_text(json.dumps(receipt,indent=2))
          summary={k:v for k,v in receipt.items() if k != 'collection_reports'}
          summary['collection_reports']={selection:{
              'path':entry['path'],'sha256':entry['sha256'],
              'status':entry['report'].get('status'),
              'execution_status':entry['report'].get('execution_status'),
              'full_collection_completed':entry['report'].get('full_collection_completed'),
              'league_count':len(entry['report'].get('leagues',[])),
              'fixture_count':len(entry['report'].get('matches',[])),
              'pending_requests':entry['report'].get('pending_requests'),
              'deferred_requests':entry['report'].get('deferred_requests'),
              'engineering_failure_count':entry['report'].get('engineering_failure_count'),
              'api_requests':entry['report'].get('api_requests')
          } for selection,entry in reports.items()}
          summary['full_receipt_artifact']='advanced-run-receipt.json'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write('# 全面特征实际执行\n\n```json\n'+json.dumps(summary,indent=2)+'\n```\n\n数据延期、试验阻断及效果待验均按各报告原件；完整实施不等于效果已获确认。\n')
          PY
      - name: 导出有界当轮报告与固定状态读取清单
        id: export
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/export_advanced_evidence.py --runtime runtime --repo .
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        with:
          name: advanced-models-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            advanced-models-evidence.tar.gz
            advanced-models-evidence.tar.sha256
            advanced-run-parent.json
            advanced-run-receipt.json
            feature-run-receipt.json
            feature-run-parent.json
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: 工程失败保持失败
        if: >-
          !cancelled() && (steps.restore.outcome != 'success' || steps.durable.outcome != 'success' ||
          steps.check.outcome != 'success' ||
          (env.STUDY_RUN == 'true' && env.IS_RELEASE != 'true' && steps.research.outcome != 'success') ||
          (env.IS_RELEASE == 'true' && env.STUDY_RUN == 'true' && env.RESEARCH_ONLY != 'true' &&
          (steps.club_schedule_collection.outcome != 'success' || steps.pilot_collection.outcome != 'success' || steps.collection.outcome != 'success')) ||
          (env.IS_RELEASE == 'true' && (steps.persist.outcome != 'success' ||
          (env.RESEARCH_ONLY != 'true' && (steps.facts.outcome != 'success' || steps.confirmation.outcome != 'success' ||
          steps.capture.outcome != 'success' || steps.scoring.outcome != 'success')))))
          || (!cancelled() && env.IS_RELEASE == 'true' && env.LEGACY_SHORT_RUN == 'true' &&
          (steps.legacy_capture_v1.outcome != 'success' || steps.legacy_capture_v2.outcome != 'success' ||
          steps.legacy_scoring_v1.outcome != 'success' || steps.legacy_scoring_v2.outcome != 'success'))
          || (!cancelled() && needs.pre_study_capture.result == 'failure')
        run: exit 1
  study_leagues:
    needs: advanced
    if: >-
      !cancelled() && github.repository == 'wuyan0231-hub/football-model' && github.ref == 'refs/heads/main' &&
      !(github.event_name == 'workflow_dispatch' && inputs.short_only == true) &&
      (github.event_name != 'schedule' || github.event.schedule == '7 2 * * *') &&
      needs.advanced.outputs.restore_outcome == 'success' && needs.advanced.outputs.persist_outcome == 'success'
    # Reacquire the same state-writer lock after each league. Other short jobs
    # can run between leagues; each writer restores the then-current parent.
    concurrency:
      group: football-model-state
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # A manual continuation never rewrites the all-league denominator.
        # Finalize below still verifies all 18 active domestic saved checkpoints, without fits.
        league: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.research_only == true && inputs.research_leagues == 'remaining_after_epl_championship' && '["laliga","bundesliga","serie_a","ligue_1","bundesliga_2","ligue_2","allsvenskan","eredivisie","primeira","brazil_a","j1","k1","mls","liga_mx","segunda","argentina_a"]' || '["epl","championship","laliga","bundesliga","serie_a","ligue_1","bundesliga_2","ligue_2","allsvenskan","eredivisie","primeira","brazil_a","j1","k1","mls","liga_mx","segunda","argentina_a"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      STUDY_LEAGUE: ${{ matrix.league }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: 检查本轮持久化停止标记
        id: storage_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq "[.artifacts[] | select(.name | startswith(\"advanced-study-storage-stop-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-\"))] | length" > advanced-storage-stop-count.txt
          # Also stop when the earlier stop-artifact upload itself failed,
          # for example because the account's Actions artifact quota is full.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '[.jobs[].steps[]? | select(.name == "发布本轮停止新拟合标记" and .conclusion != null and .conclusion != "skipped")] | length' > advanced-storage-stop-step-count.txt
          python - <<'PY'
          import json,os
          from pathlib import Path
          count=int(Path('advanced-storage-stop-count.txt').read_text())
          attempted=int(Path('advanced-storage-stop-step-count.txt').read_text())
          allow=count==0 and attempted==0
          Path('advanced-study-run-gate.json').write_text(json.dumps({'allow_new_fit':allow,'prior_storage_stop_artifacts':count,'prior_storage_stop_upload_attempts':attempted}))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write('allow_fit='+str(allow).lower()+'\n')
          PY
      - name: 安装真实R独立候选依赖
        if: steps.storage_gate.outputs.allow_fit == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-jsonlite
          Rscript --vanilla -e 'stopifnot(requireNamespace("jsonlite", quietly=TRUE))'
      - name: 取得该联赛任务开始时的最新固定父状态
        id: restore
        if: steps.storage_gate.outputs.allow_fit == 'true'
        run: |
          python scripts/cloud_state.py load --runtime runtime
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          gitdir=Path(subprocess.check_output(['git','rev-parse','--absolute-git-dir'],text=True).strip())
          marker=json.loads((gitdir/'football-cloud-state.json').read_text())
          Path('advanced-run-parent.json').write_text(json.dumps({k:marker.get(k) for k in ['state_oid','source_sha','loaded_at']}))
          with Path(os.environ['GITHUB_ENV']).open('a') as handle:
              handle.write('ADVANCED_PARENT_STATE='+str(marker.get('state_oid') or '')+'\n')
          PY
      - name: 保留旧原件校验失败并隔离
        id: durable
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m football_model.advanced_durability --runtime runtime --state-commit "$ADVANCED_PARENT_STATE"
      - name: 拟合前核可保存峰值
        id: preflight
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/cloud_state.py prepare --runtime runtime
          python scripts/cloud_state.py preflight --runtime runtime > advanced-preflight-before-study.json
      - name: 单联赛真实研究与独立持久检查点
        id: research
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        run: python scripts/advanced_study_window.py --selection "$STUDY_LEAGUE" -- python scripts/cloud_state_save_checked.py run --repo . --runtime runtime --receipt advanced-checkpoint-checked-save.json -- python -m football_model.advanced_research study --runtime runtime --league "$STUDY_LEAGUE" --protocol advanced-models-domestic-v1.json --source-commit "$GITHUB_SHA" --state-commit "$ADVANCED_PARENT_STATE" --run-goalmodel --checkpoint-state --repo .
      - name: 分列原命令失败与精确远端保存恢复
        id: recovery_record
        if: ${{ !cancelled() && steps.research.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import json,os,re,shutil
          from pathlib import Path
          receipt=json.loads(Path('advanced-checkpoint-checked-save.json').read_bytes())
          if (receipt.get('schema_version')!='cloud-state-save-checked-v1'
              or receipt.get('source_sha')!=os.environ['GITHUB_SHA']
              or receipt.get('github_run_id')!=os.environ['GITHUB_RUN_ID']
              or receipt.get('github_run_attempt')!=os.environ['GITHUB_RUN_ATTEMPT']
              or receipt.get('study',{}).get('league')!=os.environ['STUDY_LEAGUE']):
              raise ValueError('checked receipt is not this actual league command')
          recovered=receipt.get('recovered_state_only') is True
          planned=''
          if recovered:
              proof=receipt.get('recovery',{});planned=proof.get('planned_commit','')
              if (receipt.get('status')!='push_timeout_remote_save_verified'
                  or receipt.get('operation_completed') is not False
                  or receipt.get('original_exit_code')!=124 or receipt.get('wrapper_exit_code')!=0
                  or not re.fullmatch('[0-9a-f]{40}(?:[0-9a-f]{24})?',planned)
                  or proof.get('remote_observations')!=[planned,planned]
                  or proof.get('checkpoint',{}).get('calculation_completed') is not True
                  or proof.get('checkpoint',{}).get('league')!=os.environ['STUDY_LEAGUE']
                  or proof.get('checkpoint',{}).get('protocol_hash')!=receipt.get('study',{}).get('protocol_hash')):
                  raise ValueError('incomplete timeout recovery proof')
              shutil.copyfile('advanced-study-run-window.json','advanced-study-run-first-window.json')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write('recovered='+str(recovered).lower()+'\n')
              handle.write('state='+planned+'\n')
          PY
      - name: 保存恢复后实际重验检查点而不重新拟合
        id: resume_research
        if: steps.recovery_record.outputs.recovered == 'true'
        continue-on-error: true
        env:
          RECOVERED_STATE: ${{ steps.recovery_record.outputs.state }}
        run: python scripts/advanced_study_window.py --selection "$STUDY_LEAGUE" -- python -m football_model.advanced_research study --runtime runtime --league "$STUDY_LEAGUE" --protocol advanced-models-domestic-v1.json --source-commit "$GITHUB_SHA" --state-commit "$RECOVERED_STATE" --run-goalmodel --checkpoint-state --repo . --resume-only
      - name: 核实际检查点重验语义并保留延期失败
        id: resume_check
        if: ${{ !cancelled() && steps.recovery_record.outputs.recovered == 'true' }}
        continue-on-error: true
        env:
          RESUME_RESEARCH: ${{ steps.resume_research.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.advanced_study_window import current_report
          binding=current_report(os.environ['RESUME_RESEARCH'],os.environ['STUDY_LEAGUE'])
          study=binding.get('report',{});results=study.get('results',[])
          if (os.environ['RESUME_RESEARCH']!='success' or binding.get('status')!='current_report_verified'
              or study.get('stored_research_durable_full_completed') is not True
              or study.get('stored_verified_completed_leagues')!=1 or len(results)!=1
              or results[0].get('league')!=os.environ['STUDY_LEAGUE']
              or results[0].get('durable_saved') is not True
              or results[0].get('saved_snapshot_verified') is not True
              or results[0].get('durability_status')!='verified_saved_git_closure'):
              raise ValueError('native zero exit is not a verified saved checkpoint')
          receipt={'schema_version':'native-resume-verified-v1','status':'verified_saved_git_closure',
              'league':os.environ['STUDY_LEAGUE'],'source_commit':os.environ['GITHUB_SHA'],
              'github_run_id':os.environ['GITHUB_RUN_ID'],'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'report_path':binding['path'],'report_sha256':binding['sha256'],
              'checkpoint_ref':results[0].get('checkpoint_ref'),
              'current_inputs_match':results[0].get('current_inputs_match'),
              'current_refit_required':results[0].get('current_refit_required'),
              'fit_attempted_by_resume':False,'production_promoted':False}
          with Path('advanced-resume-verification.json').open('x') as handle:
              json.dump(receipt,handle,indent=2)
          PY
      - name: 保存当次汇总与失败原件
        id: persist
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        continue-on-error: true
        run: |
          python scripts/cloud_state_save_once.py --runtime runtime --preflight-report advanced-preflight-after-study.json --receipt advanced-league-save-run-receipt.json
      - name: 记录实际计算、已存状态及后续停止条件
        if: ${{ !cancelled() }}
        env:
          STORAGE_GATE: ${{ steps.storage_gate.outcome }}
          ALLOW_FIT: ${{ steps.storage_gate.outputs.allow_fit }}
          RESTORE: ${{ steps.restore.outcome }}
          DURABLE: ${{ steps.durable.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          RESEARCH: ${{ steps.research.outcome }}
          RECOVERY_RECORD: ${{ steps.recovery_record.outcome }}
          CHECKPOINT_RECOVERED: ${{ steps.recovery_record.outputs.recovered }}
          RESUME_RESEARCH: ${{ steps.resume_research.outcome }}
          RESUME_CHECK: ${{ steps.resume_check.outcome }}
          PERSIST: ${{ steps.persist.outcome }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          keys=['GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','STUDY_LEAGUE','ADVANCED_PARENT_STATE','STORAGE_GATE','ALLOW_FIT','RESTORE','DURABLE','PREFLIGHT','RESEARCH','PERSIST']
          receipt={k:os.environ.get(k) for k in keys}
          receipt.update({k:os.environ.get(k) for k in ['RECOVERY_RECORD','CHECKPOINT_RECOVERED','RESUME_RESEARCH','RESUME_CHECK']})
          checked_path=Path('advanced-checkpoint-checked-save.json')
          if checked_path.is_file():
              checked_raw=checked_path.read_bytes();checked=json.loads(checked_raw)
              receipt['original_research_command']={'receipt_path':str(checked_path),'receipt_sha256':hashlib.sha256(checked_raw).hexdigest(),
                  'original_exit_code':checked.get('original_exit_code'),'operation_completed':checked.get('operation_completed'),
                  'recovered_state_only':checked.get('recovered_state_only'),'status':checked.get('status')}
          from scripts.advanced_study_window import current_report
          native_outcome=receipt['RESUME_RESEARCH'] if receipt['CHECKPOINT_RECOVERED']=='true' else receipt['RESEARCH']
          binding=current_report(native_outcome,receipt['STUDY_LEAGUE'])
          receipt['study_report_binding']={k:v for k,v in binding.items() if k!='report'}
          study=binding.get('report',{})
          if binding['status']=='current_report_verified':
              receipt['study_report']=binding
          stop=receipt['STORAGE_GATE']!='success' or receipt['RESTORE']=='failure' or receipt['PREFLIGHT']=='failure' or receipt['PERSIST']=='failure' or any(study.get(k,0)>0 for k in ['capacity_deferred_leagues','checkpoint_deferred_leagues','checkpoint_failed_leagues'])
          stop=stop or receipt['RECOVERY_RECORD']=='failure' or (receipt['CHECKPOINT_RECOVERED']=='true' and (receipt['RESUME_RESEARCH']!='success' or receipt['RESUME_CHECK']!='success'))
          receipt.update(storage_stop=stop,production_promoted=False,accuracy_improvement_verified=False,bundle_kind='thin_run_inspection')
          gitdir=Path(subprocess.check_output(['git','rev-parse','--absolute-git-dir'],text=True).strip())
          marker=gitdir/'football-cloud-state.json'
          if marker.is_file():
              value=json.loads(marker.read_text());receipt['post_save_state']={k:value.get(k) for k in ['state_oid','source_sha','loaded_at']}
          Path('advanced-study-run-receipt.json').write_text(json.dumps(receipt,indent=2))
          if stop:
              Path('advanced-study-storage-stop.json').write_text(json.dumps({'league':receipt['STUDY_LEAGUE'],'reason':'persistence_or_resource_failure','receipt':'advanced-study-run-receipt.json'}))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as handle:
              handle.write('## '+str(receipt['STUDY_LEAGUE'])+' 研究事实\n\n```json\n'+json.dumps(receipt,indent=2)+'\n```\n')
          PY
      - name: 发布本轮停止新拟合标记
        if: ${{ !cancelled() && hashFiles('advanced-study-storage-stop.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: advanced-study-storage-stop-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.league }}
          path: advanced-study-storage-stop.json
          retention-days: 2
          if-no-files-found: error
      - name: 有界联赛回读原件清单
        id: export
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/export_advanced_evidence.py --runtime runtime --repo . --league "$STUDY_LEAGUE"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (steps.export.outcome == 'success' || steps.restore.outcome == 'skipped') }}
        with:
          name: advanced-study-${{ matrix.league }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            advanced-models-evidence.tar.gz
            advanced-models-evidence.tar.sha256
            advanced-study-run-receipt.json
            advanced-study-run-gate.json
            advanced-checkpoint-checked-save.json
            advanced-study-run-first-window.json
            advanced-resume-verification.json
            advanced-preflight*.json
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: 真实失败与持久化阻断保留
        if: >-
          !cancelled() && (steps.storage_gate.outcome != 'success' || steps.storage_gate.outputs.allow_fit != 'true' ||
          steps.restore.outcome != 'success' || steps.durable.outcome != 'success' || steps.preflight.outcome != 'success' ||
          steps.research.outcome != 'success' || steps.recovery_record.outcome != 'success' ||
          (steps.recovery_record.outputs.recovered == 'true' && (steps.resume_research.outcome != 'success' || steps.resume_check.outcome != 'success')) ||
          steps.persist.outcome != 'success' || hashFiles('advanced-study-storage-stop.json') != '')
        run: exit 1
  study_finalize:
    needs: [advanced, study_leagues]
    if: >-
      !cancelled() && github.repository == 'wuyan0231-hub/football-model' && github.ref == 'refs/heads/main' &&
      !(github.event_name == 'workflow_dispatch' && inputs.short_only == true) &&
      (github.event_name != 'schedule' || github.event.schedule == '7 2 * * *') &&
      needs.advanced.outputs.restore_outcome == 'success' && needs.advanced.outputs.persist_outcome == 'success'
    concurrency:
      group: football-model-state
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: 恢复最终只读核验父状态
        id: restore
        run: |
          python scripts/cloud_state.py load --runtime runtime
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          gitdir=Path(subprocess.check_output(['git','rev-parse','--absolute-git-dir'],text=True).strip())
          marker=json.loads((gitdir/'football-cloud-state.json').read_text())
          Path('advanced-run-parent.json').write_text(json.dumps({k:marker.get(k) for k in ['state_oid','source_sha','loaded_at']}))
          with Path(os.environ['GITHUB_ENV']).open('a') as handle:
              handle.write('ADVANCED_PARENT_STATE='+str(marker.get('state_oid') or '')+'\n')
          PY
      - name: 核验全部已保存检查点而不重新拟合
        id: finalize
        continue-on-error: true
        run: python scripts/advanced_study_window.py --selection all -- python -m football_model.advanced_research study --runtime runtime --league all --protocol advanced-models-domestic-v1.json --source-commit "$GITHUB_SHA" --state-commit "$ADVANCED_PARENT_STATE" --run-goalmodel --checkpoint-state --repo . --resume-only
      - name: 核验真正当前资料的确认门禁
        id: confirmation
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m football_model.advanced_confirmation --runtime runtime --league all --advanced-protocol advanced-models-domestic-v1.json --protocol advanced-confirmation-v1.json --auto-activate
      - name: 保存最终核验与未完成分母
        id: persist
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        continue-on-error: true
        run: |
          python scripts/cloud_state_save_once.py --runtime runtime --preflight-report advanced-preflight-final.json --receipt advanced-final-save-run-receipt.json
      - name: 保存最终回执与有界清单
        id: export
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINALIZE: ${{ steps.finalize.outcome }}
          CONFIRMATION: ${{ steps.confirmation.outcome }}
          PERSIST: ${{ steps.persist.outcome }}
          LEAGUE_JOBS: ${{ needs.study_leagues.result }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          receipt={k:os.environ.get(k) for k in ['GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','ADVANCED_PARENT_STATE','FINALIZE','CONFIRMATION','PERSIST','LEAGUE_JOBS']}
          from scripts.advanced_study_window import current_report
          binding=current_report(receipt['FINALIZE'],'all')
          receipt['study_report_binding']={k:v for k,v in binding.items() if k!='report'}
          receipt['research_full_completed']=False
          if binding['status']=='current_report_verified':
              receipt['study_report']=binding
              receipt['research_full_completed']=receipt['FINALIZE']=='success' and receipt['PERSIST']=='success' and binding['report'].get('research_full_completed') is True
          receipt.update(production_promoted=False,accuracy_improvement_verified=False,bundle_kind='thin_run_inspection')
          Path('advanced-final-run-receipt.json').write_text(json.dumps(receipt,indent=2))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as handle:
              handle.write('## 全联赛持久化核验\n\n```json\n'+json.dumps(receipt,indent=2)+'\n```\n')
          PY
          python scripts/export_advanced_evidence.py --runtime runtime --repo .
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        with:
          name: advanced-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            advanced-models-evidence.tar.gz
            advanced-models-evidence.tar.sha256
            advanced-final-run-receipt.json
            advanced-preflight-final.json
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: 未完成与执行失败保持可见
        if: >-
          !cancelled() && (steps.restore.outcome != 'success' || steps.finalize.outcome != 'success' ||
          steps.confirmation.outcome != 'success' || steps.persist.outcome != 'success' || needs.study_leagues.result != 'success')
        run: exit 1
