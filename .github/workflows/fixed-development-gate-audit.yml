name: 固定已保存研究的完整开发门与样本日历只读审计

on:
  push:
    branches: [codex/s3-r07-fixed-gates-20261018]
    paths: ['.github/workflows/fixed-development-gate-audit.yml']
  workflow_dispatch:
    inputs:
      state_commit:
        description: 精确40位已保存model-state提交（不是移动分支）
        type: string
        required: true
        default: a99395311e2eaf3cea2f06487aab564362021f23
      leagues:
        description: 已保存联赛的逗号列表；只读复算，不拟合或激活
        type: string
        required: true
        default: epl,championship,laliga,bundesliga,serie_a,ligue_1,bundesliga_2,ligue_2,allsvenskan,eredivisie,primeira,brazil_a,j1

permissions:
  contents: read
  actions: read

jobs:
  saved_development_gates:
    if: github.repository == 'wuyan0231-hub/football-model' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/s3-r07-fixed-gates-20261018')))
    runs-on: ubuntu-latest
    # Only this read-only batch audit; production deadlines/capacity are unchanged.
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      FOOTBALL_API_KEY: ''
      AUDIT_STATE_COMMIT: ${{ github.event_name == 'push' && 'a99395311e2eaf3cea2f06487aab564362021f23' || inputs.state_commit }}
      AUDIT_LEAGUES: ${{ github.event_name == 'push' && 'epl,championship,laliga,bundesliga,serie_a,ligue_1,bundesliga_2,ligue_2,allsvenskan,eredivisie,primeira,brazil_a,j1' || inputs.leagues }}
    steps:
      - name: 验证固定身份与联赛参数（网络前）
        run: |
          python - <<'VALIDATE_R07'
          import os, re
          state = os.environ.get('AUDIT_STATE_COMMIT', '')
          leagues = os.environ.get('AUDIT_LEAGUES', '').split(',')
          allowed = {'epl','championship','laliga','bundesliga','serie_a','ligue_1','bundesliga_2','ligue_2','allsvenskan','eredivisie','primeira','brazil_a','j1','k1','mls','liga_mx','segunda','argentina_a'}
          if not re.fullmatch(r'[a-f0-9]{40}', state):
              raise SystemExit('exact_fixed_state_sha_required')
          if not leagues or len(leagues) != len(set(leagues)) or any(l not in allowed for l in leagues):
              raise SystemExit('invalid_league_selection')
          VALIDATE_R07
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 原依赖与只读审计针对性回归
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p test_fixed_development_gate_audit.py -v
      - name: 恢复一次，逐联赛完整20项门、五指标方差和样本日历
        id: audit
        continue-on-error: true
        run: >-
          python scripts/fixed_development_gate_audit.py --repo .
          --state-commit "$AUDIT_STATE_COMMIT"
          --implementation 1e311689b3405f64c6ad9636732d2defb7ad67e26b4bc7e04b01a5b1b2b2d6ac
          --leagues "$AUDIT_LEAGUES" --output fixed-r07-audit
      - name: 保存有界完整回执与数值见证（无原始API正文）
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fixed-development-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixed-r07-audit/
          retention-days: 14
          if-no-files-found: warn
      - name: 保留实际未完成或失败
        if: ${{ !cancelled() && steps.audit.outcome != 'success' }}
        run: exit 1
