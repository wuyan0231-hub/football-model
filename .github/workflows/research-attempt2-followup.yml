name: 固定原研究 attempt2 完成后的五联赛只读验收

on:
  workflow_run:
    workflows: ['足球全面特征：补采、训练、未来对照与确认']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: readonly-research-38928003279-2
  cancel-in-progress: false

jobs:
  fixed_saved_league:
    if: >-
      github.repository == 'wuyan0231-hub/football-model' &&
      github.event.repository.id == 1380205666 &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.id == 38928003279 &&
          github.event.workflow_run.run_attempt == 2 &&
          github.event.workflow_run.head_sha == '4ae6764f2502c8892bb892c3a08bf0a34d604b1a' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.path == '.github/workflows/advanced-models.yml' &&
          github.event.workflow_run.head_repository.id == 1380205666
        )
      )
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        league: [mls, unl, liga_mx, segunda, argentina_a]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOOTBALL_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 原依赖与后继安全契约回归
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p test_research_attempt2_followup.py -v
      - name: 固定原件身份与单次恢复，两项只读验收
        id: audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_LEAGUE: ${{ matrix.league }}
        run: >-
          timeout --preserve-status --signal=TERM --kill-after=10 3300
          python scripts/research_attempt2_followup.py
          --league "$AUDIT_LEAGUE" --output followup-output
      - name: 保留硬截止或启动失败，不冒称原研究未保存
        id: upload_guard
        if: ${{ always() }}
        env:
          AUDIT_LEAGUE: ${{ matrix.league }}
        run: |
          python - <<'PY'
          import json,os,tempfile
          from pathlib import Path
          output=Path('followup-output');output.mkdir(exist_ok=True)
          paths=list(output.rglob('*'))
          if any(p.is_symlink() for p in paths) or sum(p.stat().st_size for p in paths if p.is_file())>40*1024*1024:
              quarantine=Path(tempfile.mkdtemp(prefix='followup-oversize-',dir=output.parent))/'original'
              output.rename(quarantine);output.mkdir()
              (output/'run-final.json').write_text(json.dumps({'schema_version':'fixed-research-attempt2-followup-v1',
                  'league':os.environ['AUDIT_LEAGUE'],'original_run_id':38928003279,'original_run_attempt':2,
                  'original_source_commit':'4ae6764f2502c8892bb892c3a08bf0a34d604b1a','status':'audit_incomplete',
                  'error_code':'upload_hard_guard','original_outputs_preserved_in_runner_only':True}))
          if not (output/'run-final.json').exists():
              value={'schema_version':'fixed-research-attempt2-followup-v1','league':os.environ['AUDIT_LEAGUE'],
                  'original_run_id':38928003279,'original_run_attempt':2,'status':'audit_incomplete',
                  'original_source_commit':'4ae6764f2502c8892bb892c3a08bf0a34d604b1a',
                  'error_code':'no_terminal_receipt_deadline_or_setup_failure','fits':0,'network_football_requests':0,
                  'remote_state_writes':0,'activation_performed':False,'production_promoted':False}
              (output/'run-final.json').write_text(json.dumps(value))
          PY
      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.upload_guard.outcome == 'success' }}
        with:
          name: research-attempt2-followup-${{ matrix.league }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: followup-output/
          retention-days: 14
          if-no-files-found: error
      - name: 未完成或拒绝必须保留失败
        if: ${{ !cancelled() && steps.audit.outcome != 'success' }}
        run: exit 1

  closure_manifest:
    needs: fixed_saved_league
    if: ${{ always() && needs.fixed_saved_league.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: research-attempt2-followup-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts
      - name: 五项原状态与实际验收闭包清单
        id: closure
        continue-on-error: true
        run: python scripts/research_attempt2_followup.py --aggregate receipts --output five-league-closure.json
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: research-attempt2-five-league-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: five-league-closure.json
          retention-days: 14
          if-no-files-found: error
      - name: 全分母保留未完成
        if: ${{ !cancelled() && steps.closure.outcome != 'success' }}
        run: exit 1
