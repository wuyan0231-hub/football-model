name: 已完成联赛逐项固定研究只读验收

on:
  push:
    branches: [codex/s3-completed-league-audits-20261017]
    paths:
      - '.github/workflows/fixed-research-followup-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fixed_completed_league_audit:
    if: github.repository == 'wuyan0231-hub/football-model'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        # The previous fixed run already completed the other four leagues.
        # Retry only the failed key validation after its code fix.
        league: [ligue_1]
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      FOOTBALL_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 原依赖与已合并只读验收器安全回归
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p test_fixed_research_report_audit.py -v
      - name: 单联赛完整报告与同池评分（零API、零拟合、零远端状态写入）
        id: audit
        continue-on-error: true
        run: >-
          python scripts/fixed_research_report_audit.py --repo .
          --state-commit 8d05a8eab883a6a128d359be29d97120be07c35a
          --implementation 1e311689b3405f64c6ad9636732d2defb7ad67e26b4bc7e04b01a5b1b2b2d6ac
          --leagues ${{ matrix.league }}
          --output fixed-research-report-audit.json
      - name: 仅保存有界数字回执及失败阶段（不上传原始API或完整单场包）
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fixed-completed-research-audit-${{ matrix.league }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixed-research-report-audit.json
          retention-days: 14
          if-no-files-found: warn
      - name: 保留实际未完成或数值失败
        if: ${{ !cancelled() && steps.audit.outcome != 'success' }}
        run: exit 1
