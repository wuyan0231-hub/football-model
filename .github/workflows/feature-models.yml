name: 足球特征模型：历史研究与双时点影子

on:
  push:
    branches: [main, codex/feature-models-20261013, codex/s3-paired-research-20261013]
    paths:
      - 'football_model/feature_*.py'
      - 'football_model/goalmodel_adapter.py'
      - 'scripts/goalmodel_bridge.R'
      - 'third_party/goalmodel/**'
      - 'feature-models.json'
      - 'feature-models-v2.json'
      - 'requirements.txt'
      - '.github/workflows/feature-models.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '47 1 * * *'

permissions:
  contents: write

concurrency:
  group: football-model-state
  cancel-in-progress: false

jobs:
  features:
    if: >-
      github.event.repository.private == true &&
      (github.event_name != 'schedule' || vars.ENABLE_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      IS_RELEASE: ${{ github.ref == 'refs/heads/main' }}
      STUDY_RUN: ${{ github.event_name != 'schedule' || github.event.schedule == '47 1 * * *' }}
    steps:
      - name: 读取固定本轮源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装Python依赖
        run: python -m pip install -r requirements.txt
      - name: 安装独立R运行环境
        if: env.STUDY_RUN == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-jsonlite
      - name: 全量离线回归与真实R接口训练
        if: env.STUDY_RUN == 'true'
        run: |
          Rscript --vanilla -e 'stopifnot(requireNamespace("jsonlite", quietly=TRUE))'
          python -m unittest discover -s tests -v
      - name: 恢复完整原状态
        id: restore
        run: python scripts/cloud_state.py load --runtime runtime
      - name: 记录本轮真实状态父提交
        run: |
          python - <<'PY'
          import json,subprocess,os
          from pathlib import Path
          git_dir=Path(subprocess.check_output(['git','rev-parse','--absolute-git-dir'],text=True).strip())
          marker=json.loads((git_dir/'football-cloud-state.json').read_text())
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
              f.write('FEATURE_PARENT_STATE='+str(marker.get('state_oid') or '')+'\n')
          Path('feature-run-parent.json').write_text(json.dumps({k:v for k,v in marker.items() if k in ['source_sha','state_oid','loaded_at']},indent=2))
          PY
      - name: 补齐试点完整俱乐部赛程并保存原件
        id: schedule
        if: env.STUDY_RUN == 'true' && env.IS_RELEASE == 'true'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.feature_schedule --runtime runtime --config config.json --league serie_a --source-commit "$GITHUB_SHA"
      - name: 运行时间顺序修正与goalmodel独立对照
        id: research
        if: env.STUDY_RUN == 'true'
        continue-on-error: true
        run: python -m football_model.feature_research study --runtime runtime --league serie_a --source-commit "$GITHUB_SHA" --state-commit "$FEATURE_PARENT_STATE" --run-goalmodel
      - name: 运行v2完整训练池与全请求研究
        id: research_v2
        if: env.STUDY_RUN == 'true'
        continue-on-error: true
        run: python -m football_model.feature_research study --runtime runtime --league serie_a --source-commit "$GITHUB_SHA" --state-commit "$FEATURE_PARENT_STATE" --protocol feature-models-v2.json --run-goalmodel
      - name: 取得未来11小时试点最新事实
        id: facts
        if: env.IS_RELEASE == 'true'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.collect_fundamentals --runtime runtime --config config.json --league serie_a --horizon-hours 11 --recent-matches 5
      - name: 冻结真实提前版与确认首发版
        id: capture
        if: env.IS_RELEASE == 'true'
        continue-on-error: true
        run: python -m football_model.feature_snapshots capture --runtime runtime --config config.json --league serie_a --source-commit "$GITHUB_SHA" --state-commit "$FEATURE_PARENT_STATE" --protocol feature-models.json
      - name: 冻结v2原件重建与真实双时点
        id: capture_v2
        if: env.IS_RELEASE == 'true'
        continue-on-error: true
        run: python -m football_model.feature_snapshots capture --runtime runtime --config config.json --league serie_a --source-commit "$GITHUB_SHA" --state-commit "$FEATURE_PARENT_STATE" --protocol feature-models-v2.json
      - name: 独立赛果同步与首次候选评分
        id: scoring
        if: env.IS_RELEASE == 'true'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.feature_scoring score --runtime runtime --config config.json --league serie_a --source-commit "$GITHUB_SHA" --protocol feature-models.json
      - name: v2全机会独立评分与基线回退
        id: scoring_v2
        if: env.IS_RELEASE == 'true'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.feature_scoring score --runtime runtime --config config.json --league serie_a --source-commit "$GITHUB_SHA" --protocol feature-models-v2.json
      - name: 核输出完整性与既有存储上限
        id: check
        if: always() && steps.restore.outcome == 'success'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/cloud_state.py check --runtime runtime
      - name: 保存新研究与影子原件
        id: persist
        if: always() && env.IS_RELEASE == 'true' && steps.check.outcome == 'success'
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/cloud_state.py save --runtime runtime
      - name: 保存本轮执行回执
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          SCHEDULE_OUTCOME: ${{ steps.schedule.outcome }}
          RESEARCH_OUTCOME: ${{ steps.research.outcome }}
          RESEARCH_V2_OUTCOME: ${{ steps.research_v2.outcome }}
          FACTS_OUTCOME: ${{ steps.facts.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          CAPTURE_V2_OUTCOME: ${{ steps.capture_v2.outcome }}
          SCORING_OUTCOME: ${{ steps.scoring.outcome }}
          SCORING_V2_OUTCOME: ${{ steps.scoring_v2.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          receipt={k:os.environ.get(k) for k in ['GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','FEATURE_PARENT_STATE','IS_RELEASE','STUDY_RUN','RESTORE_OUTCOME','SCHEDULE_OUTCOME','RESEARCH_OUTCOME','RESEARCH_V2_OUTCOME','FACTS_OUTCOME','CAPTURE_OUTCOME','CAPTURE_V2_OUTCOME','SCORING_OUTCOME','SCORING_V2_OUTCOME','CHECK_OUTCOME','PERSIST_OUTCOME']}
          receipt.update(confirmation_active=False,production_promoted=False)
          Path('feature-run-receipt.json').write_text(json.dumps(receipt,indent=2))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('# 特征模型真实工程执行\n\n```json\n'+json.dumps(receipt,indent=2)+'\n```\n')
              path=Path('runtime/feature_models/reports/serie_a/latest.json')
              if os.environ.get('RESEARCH_OUTCOME')=='success' and path.exists():
                  report=json.loads(path.read_text())
                  out.write('\n## 历史开发对照（不代表确认效果或收益）\n\n```json\n'+json.dumps(report['comparisons'],ensure_ascii=False,indent=2)+'\n```\n')
              out.write('\n未采用新方案替换生产基线；双时距首发与人员特征是否实到另按原件。\n')
          PY
      - name: 上传独立工程原件
        if: always() && steps.check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: feature-models-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/feature_models/
            runtime/feature_snapshots/
            feature-run-receipt.json
            feature-run-parent.json
          retention-days: 14
          if-no-files-found: error
      - name: 标明真实失败
        if: >-
          always() &&
          (steps.restore.outcome != 'success' || steps.check.outcome != 'success' ||
          (env.STUDY_RUN == 'true' && (steps.research.outcome != 'success' || steps.research_v2.outcome != 'success')) ||
          (env.IS_RELEASE == 'true' && (steps.persist.outcome != 'success' || steps.facts.outcome != 'success' || steps.capture.outcome != 'success' || steps.capture_v2.outcome != 'success' || steps.scoring.outcome != 'success' || steps.scoring_v2.outcome != 'success')) ||
          (env.IS_RELEASE == 'true' && env.STUDY_RUN == 'true' && steps.schedule.outcome != 'success'))
        run: exit 1
