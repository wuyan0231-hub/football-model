name: 足球模型：数据检查与自动训练

# This file configures a workflow; it does not deploy or enable it by itself.
on:
  # Train a newly added league, otherwise recheck the venue adapter on release.
  push:
    branches: [main]
    paths:
      - 'football_model/venue_registry.py'
      - 'football_model/nations.py'
      - 'football_model/nations_venues.json'
      - 'football_model/nations_venue_city_aliases.json'
      - 'football_model/nations_match_locations.json'
      - 'football_model/match_locations.py'
      - 'football_model/coverage_audit.py'
      - 'football_model/data.py'
      - 'football_model/cli.py'
      - 'football_model/fundamentals.py'
      - 'football_model/collect_fundamentals.py'
      - 'football_model/prospective.py'
      - 'football_model/result_sync.py'
      - 'football_model/settlement.py'
      - 'football_model/production_replay.py'
      - 'football_model/collect_quotes.py'
      - 'config.json'
      - '.github/training-requests/*.json'
  workflow_dispatch:
    inputs:
      mode:
        description: audit 检查数据；train 训练基础模型
        type: choice
        required: true
        default: audit
        options: [audit, train]
      league:
        description: 选择单个赛事；championship 英冠；ucl 仅审计；unl 欧国联；liga_mx 墨西超；segunda 西乙；argentina_a 阿甲；all 批量运行
        type: choice
        required: true
        default: epl
        options: [epl, championship, laliga, bundesliga, serie_a, ligue_1, bundesliga_2, ligue_2, ucl, allsvenskan, eredivisie, primeira, brazil_a, j1, k1, mls, unl, liga_mx, segunda, argentina_a, all]
  schedule:
    # UTC 01:17 = 北京时间 09:17。GitHub 可能延迟执行。
    - cron: '17 1 * * *'

permissions:
  contents: write

concurrency:
  group: football-model-state
  cancel-in-progress: false
  queue: max

jobs:
  football:
    # No scheduled API calls until Settings > Variables > ENABLE_SCHEDULE=true.
    # Data/licensing and model state are intended for this private repository.
    if: >-
      github.event.repository.private == true &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || vars.ENABLE_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    # 60m model + 5m result sync + 10m quotes + 15m fundamentals soft limits;
    # leave 20m for tests, setup, final checks and preserving partial state.
    timeout-minutes: 110
    env:
      PYTHONUNBUFFERED: '1'
      MODE: ${{ github.event_name != 'workflow_dispatch' && 'train' || inputs.mode }}
      LEAGUE: ${{ github.event_name == 'schedule' && 'all' || github.event_name == 'push' && 'unl' || inputs.league }}
    steps:
      - name: 读取程序
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: 选择新联赛首训或场地发布验证
        if: ${{ github.event_name == 'push' }}
        env:
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$RELEASE_BEFORE_SHA"
          git show "$RELEASE_BEFORE_SHA:config.json" > "$RUNNER_TEMP/release-before-config.json"
          git diff --diff-filter=A --name-only "$RELEASE_BEFORE_SHA" HEAD -- '.github/training-requests/*.json' > "$RUNNER_TEMP/release-training-requests.txt"
          python scripts/select_release_league.py --before-config "$RUNNER_TEMP/release-before-config.json" --config config.json --github-env "$GITHUB_ENV" --requests-list "$RUNNER_TEMP/release-training-requests.txt"

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 检查模型接入发布
        if: ${{ github.event_name == 'push' }}
        run: python -m unittest discover -s tests -v

      - name: 建立本轮摘要关联
        run: python -m football_model.run_summary begin --context "$RUNNER_TEMP/football-run-context.json"

      - name: 恢复上次模型与缓存
        id: restore
        run: python scripts/cloud_state.py load --runtime runtime

      - name: 清除上次报告入口，避免将旧报告显示为本次结果
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('latest.md', 'latest.json'):
              (Path('runtime/reports') / name).unlink(missing_ok=True)
          PY

      - name: 检查数据或训练
        id: model
        # Allow reporting/persistence after CLI exit 1 or 2. Final step restores
        # the failed job status; partial failures never appear as green success.
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python -m football_model.run_summary mark --context "$RUNNER_TEMP/football-run-context.json" --stage model
          python -m football_model.cli --mode "$MODE" --league "$LEAGUE" --runtime runtime --record-replay

      - name: 检查本次生产回放包已录制
        id: replay_check
        if: ${{ always() && steps.restore.outcome == 'success' && steps.model.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from football_model.production_replay import read_bundle
          report = json.loads(Path('runtime/reports/latest.json').read_text(encoding='utf-8'))
          recording = report.get('replay_recording', {})
          if recording.get('status') != 'recorded':
              raise SystemExit('本次生产录制未完成；有效模型与预测仍另行保存。')
          bundle = read_bundle(Path('runtime') / recording['path'])
          if bundle['sha256'] != recording['sha256'] or bundle['payload']['recorded_run_id'] != report['run_id']:
              raise SystemExit('回放包与本次报告不一致。')
          print('已录制实际生产输入；离线重演是否匹配须另行核验。')
          PY

      - name: 核对逐联赛冻结并评分已结束比赛
        id: prospective
        if: ${{ always() && steps.restore.outcome == 'success' && steps.model.outcome != 'skipped' && env.MODE == 'train' }}
        # Freeze before the separate evidence collector; preserve valid records
        # even when another competition failed or a capture was too late.
        continue-on-error: true
        run: |
          python -m football_model.run_summary mark --context "$RUNNER_TEMP/football-run-context.json" --stage prospective
          rm -f runtime/prospective/latest.json
          python -m football_model.prospective --runtime runtime --config config.json

      - name: 独立同步待结算比赛的常规时间赛果
        id: result_sync
        if: ${{ always() && steps.restore.outcome == 'success' }}
        # Independent of model/train/report success; preserve old forecast scores.
        # Five-minute soft deadline, shared daily quota and original cache times.
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python -m football_model.run_summary mark --context "$RUNNER_TEMP/football-run-context.json" --stage result_sync
          rm -f runtime/result_sync/reports/latest.json
          python -m football_model.result_sync --runtime runtime --config config.json

      - name: 积累全赛事未来7天真实参考报价
        id: quotes
        if: ${{ always() && steps.restore.outcome == 'success' }}
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        # Source schedules and fresh fixture checks are independent of training.
        # No new polling schedule, automatic betting or strict-quote admission.
        run: |
          python -m football_model.run_summary mark --context "$RUNNER_TEMP/football-run-context.json" --stage quotes
          rm -f runtime/quotes/reports/latest.json
          python -m football_model.collect_quotes --runtime runtime --config config.json --league all --horizon-hours 168 --max-run-seconds 600

      - name: 采集未来24小时比赛的基本面证据
        id: fundamentals
        if: ${{ always() && steps.restore.outcome == 'success' && steps.model.outcome != 'skipped' && env.MODE == 'train' }}
        # Evidence can be incomplete without invalidating the separate score model.
        # The collector has a 15-minute soft deadline and shares the daily quota.
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python -m football_model.run_summary mark --context "$RUNNER_TEMP/football-run-context.json" --stage fundamentals
          rm -f runtime/fundamentals/reports/latest.json
          python -m football_model.collect_fundamentals --runtime runtime --config config.json --league "$LEAGUE" --horizon-hours 24

      - name: 保存真实未来模型对照并评分原有影子预测
        id: shadow_models
        if: ${{ always() && steps.restore.outcome == 'success' && env.MODE == 'train' }}
        # Offline fits use existing admitted data. No API key, added schedule,
        # production parameter change, decision recommendation or actual bet.
        continue-on-error: true
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m football_model.run_summary mark --context "$RUNNER_TEMP/football-run-context.json" --stage shadow_models
          python - <<'PYSHADOW'
          import os
          from pathlib import Path
          import subprocess
          import sys
          # These are mutable current-run pointers; immutable prior reports
          # remain available if capture or score fails this time.
          for name in ('latest.json', 'score-latest.json'):
              (Path('runtime/shadow_models/reports') / name).unlink(missing_ok=True)
          capture = subprocess.call([sys.executable, '-m', 'football_model.shadow_models', 'capture',
              '--runtime', 'runtime', '--config', 'config.json', '--league', 'all',
              '--source-commit', os.environ['GITHUB_SHA']])
          score = subprocess.call([sys.executable, '-m', 'football_model.shadow_models', 'score', '--runtime', 'runtime'])
          raise SystemExit(0 if capture == 0 and score == 0 else 1)
          PYSHADOW

      - name: 保存F5-C总球收缩对照并评分已有记录
        id: total_shrink_shadow
        if: ${{ always() && steps.restore.outcome == 'success' && env.MODE == 'train' }}
        # Derive only from already saved production180 predictions. No fit,
        # network, API credentials, production mutation or added schedule.
        continue-on-error: true
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m football_model.run_summary mark --context "$RUNNER_TEMP/football-run-context.json" --stage total_shrink_shadow
          python - <<'PYSHRINK'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          git_dir = subprocess.check_output(['git', 'rev-parse', '--absolute-git-dir'], text=True).strip()
          marker = json.loads((Path(git_dir) / 'football-cloud-state.json').read_text(encoding='utf-8'))
          if marker.get('source_sha') != os.environ['GITHUB_SHA']:
              raise SystemExit('F5-C恢复标记的源码版本与本轮不一致。')
          state_args = ['--state-commit', marker['state_oid']] if marker.get('state_oid') is not None else []
          for name in ('latest.json', 'score-latest.json'):
              (Path('runtime/total_shrink_shadow/reports') / name).unlink(missing_ok=True)
          capture = subprocess.call([sys.executable, '-m', 'football_model.total_shrink_shadow', 'capture',
              '--runtime', 'runtime', '--config', 'config.json', '--league', 'all',
              '--source-commit', os.environ['GITHUB_SHA'], *state_args])
          score = subprocess.call([sys.executable, '-m', 'football_model.total_shrink_shadow', 'score',
              '--runtime', 'runtime', '--source-commit', os.environ['GITHUB_SHA']])
          access = subprocess.call([sys.executable, '-m', 'football_model.f5c_access', 'index',
              '--runtime', 'runtime', *state_args])
          if access != 0:
              raise SystemExit(access)
          raise SystemExit(0 if capture == 0 and score == 0 else 1)
          PYSHRINK

      - name: 检查输出是否可以保存和上传
        id: check
        if: ${{ always() && steps.restore.outcome == 'success' }}
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/cloud_state.py check --runtime runtime

      - name: 保存模型、缓存和报告的长期历史
        id: persist
        if: ${{ always() && steps.check.outcome == 'success' }}
        continue-on-error: true
        env:
          # Only used for accidental-credential checks, never written or logged.
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/cloud_state.py save --runtime runtime

      - name: 在运行摘要中显示分层结果
        id: summary
        if: ${{ always() }}
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          MODEL_OUTCOME: ${{ steps.model.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          FUNDAMENTALS_OUTCOME: ${{ steps.fundamentals.outcome }}
          RESULT_SYNC_OUTCOME: ${{ steps.result_sync.outcome }}
          QUOTES_OUTCOME: ${{ steps.quotes.outcome }}
          SHADOW_MODELS_OUTCOME: ${{ steps.shadow_models.outcome }}
          TOTAL_SHRINK_SHADOW_OUTCOME: ${{ steps.total_shrink_shadow.outcome }}
          PROSPECTIVE_OUTCOME: ${{ steps.prospective.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay_check.outcome }}
        # Only whitelist-derived counts/enums enter the summary. It runs after
        # persistence so success is observed, never predicted. This JSON is an
        # artifact, not a claim that it entered the same model-state commit.
        run: >-
          python -m football_model.run_summary render
          --context "$RUNNER_TEMP/football-run-context.json"
          --runtime runtime
          --output "$RUNNER_TEMP/football-run-summary.json"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: 上传本次报告便捷副本（保留 14 天）
        if: ${{ always() && steps.check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: football-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/reports/
            runtime/predictions/
            runtime/models/
            runtime/registries/
            runtime/audits/unl/
            runtime/fundamentals/
            runtime/prospective/
            runtime/result_sync/
            runtime/quotes/
            runtime/shadow_models/
            runtime/total_shrink_shadow/
            runtime/replay/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

      - name: 上传分层摘要（独立于原运行附件布局）
        if: ${{ always() && steps.summary.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: football-run-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/football-run-summary.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: 将实际失败标记为失败
        if: ${{ always() && (steps.model.outcome != 'success' || steps.persist.outcome != 'success' || steps.prospective.outcome == 'failure' || steps.result_sync.outcome == 'failure' || steps.quotes.outcome == 'failure' || steps.shadow_models.outcome == 'failure' || steps.total_shrink_shadow.outcome == 'failure' || steps.replay_check.outcome == 'failure' || steps.summary.outcome != 'success') }}
        run: |
          echo '本次检查/训练、回放录制、前瞻冻结、赛果同步、报价采集、F4/F5-C影子实验或状态保存未完成。请查看分层摘要；不能将其视为全部成功。'
          exit 1
