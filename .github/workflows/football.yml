name: 足球模型：数据检查与自动训练

# This file configures a workflow; it does not deploy or enable it by itself.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: audit 检查数据；train 训练基础模型
        type: choice
        required: true
        default: audit
        options: [audit, train]
      league:
        description: 选择单个赛事；ucl 仅审计；unl 欧国联；liga_mx 墨西超；all 批量运行
        type: choice
        required: true
        default: epl
        options: [epl, laliga, bundesliga, serie_a, ligue_1, bundesliga_2, ligue_2, ucl, allsvenskan, eredivisie, primeira, brazil_a, j1, k1, mls, unl, liga_mx, all]
  schedule:
    # UTC 01:17 = 北京时间 09:17。GitHub 可能延迟执行。
    - cron: '17 1 * * *'

permissions:
  contents: write

concurrency:
  group: football-model-state
  cancel-in-progress: false

jobs:
  football:
    # No scheduled API calls until Settings > Variables > ENABLE_SCHEDULE=true.
    # Data/licensing and model state are intended for this private repository.
    if: >-
      github.event.repository.private == true &&
      (github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      MODE: ${{ github.event_name == 'schedule' && 'train' || inputs.mode }}
      LEAGUE: ${{ github.event_name == 'schedule' && 'all' || inputs.league }}
    steps:
      - name: 读取程序
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 恢复上次模型与缓存
        id: restore
        run: python scripts/cloud_state.py load --runtime runtime

      - name: 清除上次报告入口，避免将旧报告显示为本次结果
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('latest.md', 'latest.json'):
              (Path('runtime/reports') / name).unlink(missing_ok=True)
          PY

      - name: 检查数据或训练
        id: model
        # Allow reporting/persistence after CLI exit 1 or 2. Final step restores
        # the failed job status; partial failures never appear as green success.
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m football_model.cli --mode "$MODE" --league "$LEAGUE" --runtime runtime

      - name: 检查输出是否可以保存和上传
        id: check
        if: ${{ always() && steps.restore.outcome == 'success' && steps.model.outcome != 'skipped' }}
        continue-on-error: true
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/cloud_state.py check --runtime runtime

      - name: 保存模型、缓存和报告的长期历史
        id: persist
        if: ${{ always() && steps.check.outcome == 'success' }}
        continue-on-error: true
        env:
          # Only used for accidental-credential checks, never written or logged.
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/cloud_state.py save --runtime runtime

      - name: 上传本次报告便捷副本（保留 14 天）
        if: ${{ always() && steps.check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: football-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/reports/
            runtime/predictions/
            runtime/models/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

      - name: 在运行摘要中显示结果
        if: ${{ always() }}
        env:
          MODEL_OUTCOME: ${{ steps.model.outcome }}
          STATE_OUTCOME: ${{ steps.persist.outcome }}
          OUTPUT_CHECK: ${{ steps.check.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          report = Path('runtime/reports/latest.md')
          with summary.open('a', encoding='utf-8') as handle:
              handle.write('# 足球模型运行结果\n\n')
              handle.write('模型任务：' + os.environ['MODEL_OUTCOME'] + '\n\n')
              handle.write('状态保存：' + os.environ['STATE_OUTCOME'] + '\n\n')
              if report.is_file() and os.environ['OUTPUT_CHECK'] == 'success':
                  handle.write(report.read_text(encoding='utf-8'))
              else:
                  handle.write('本次报告未生成或未通过上传前检查，请检查失败步骤。\n')
              handle.write('\n\n只有状态保存 success 才表示本次状态已写入 model-state。附件只保留 14 天。\n')
          PY

      - name: 将实际失败标记为失败
        if: ${{ always() && (steps.model.outcome != 'success' || steps.persist.outcome != 'success') }}
        run: |
          echo '本次检查/训练或状态保存未完成。请查看运行摘要；不能将其视为训练成功。'
          exit 1
