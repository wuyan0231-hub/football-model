name: 固定捕获输入：原生无预热性能验收

on:
  push:
    branches: [codex/s3-fixed-capture-profile-20261017, codex/engineering-speed-migration]
    paths: ['.github/workflows/fixed-capture-input-profile.yml', 'scripts/fixed_capture_input_profile.py']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fixed_capture_input_profile:
    if: github.repository == 'wuyan0231-hub/football-model'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      FOOTBALL_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 安装原依赖并核两种测量方案边界
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p test_fixed_capture_input_profile.py -v
      - name: 新实现按生产路径冷读完整冻结（无prewarm、非窗口捕获或旧身份改写）
        id: profile
        continue-on-error: true
        run: >-
          python scripts/fixed_capture_input_profile.py --repo .
          --state-commit e55c1dad479990567169341624345db239ed8f4e
          --league championship
          --implementation 041d304f087669467c66ea0f3d67c710411098d95dbd670b7f7531673239a96d
          --research-implementation 1e311689b3405f64c6ad9636732d2defb7ad67e26b4bc7e04b01a5b1b2b2d6ac
          --deadline-seconds 1500
          --no-function-profiler
          --output fixed-capture-native-timing.json
      - name: 仅保留有界观测数字和无局部变量的栈（函数采样为null）
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fixed-capture-native-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixed-capture-native-timing.json
          retention-days: 14
          if-no-files-found: warn
      - name: 保持原生冻结未完成或实际失败
        if: ${{ !cancelled() && steps.profile.outcome != 'success' }}
        run: exit 1
