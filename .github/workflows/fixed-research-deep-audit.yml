name: 固定葡超原始特征及真实R重拟只读验收

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fixed_primeira_deep_audit:
    if: github.repository == 'wuyan0231-hub/football-model'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      FOOTBALL_API_KEY: ''
    steps:
      - name: 当前只读验收器与工程恢复器
        uses: actions/checkout@v7
        with:
          path: reader
          fetch-depth: 2
          persist-credentials: true
      - name: 独立原研究数值源码（旧50不改、不别名）
        uses: actions/checkout@v7
        with:
          path: original-numeric
          ref: 4ae6764f2502c8892bb892c3a08bf0a34d604b1a
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 固定数值依赖和真实R环境
        run: |
          python -m pip install -r original-numeric/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-jsonlite
          Rscript --vanilla -e 'stopifnot(requireNamespace("jsonlite", quietly=TRUE)); print(R.version.string); print(packageVersion("jsonlite")); print(extSoftVersion())'
          cd reader
          python -m unittest discover -s tests -p test_fixed_research_deep_audit.py -v
      - name: 首次真实重拟前输出固定审计协议及指纹
        run: |
          python - <<'PREREGISTER'
          import hashlib, importlib.util, json
          from pathlib import Path
          source=Path('reader/scripts/fixed_research_deep_audit.py')
          spec=importlib.util.spec_from_file_location('deep_audit',source)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          value={'state':module.STATE,'source':module.SOURCE,'implementation':module.IMPLEMENTATION,
            'report':module.REPORT_REF,'candidates':module.CANDIDATES,'tolerances':module.TOLERANCES,
            'limits':module.LIMITS,'limitations':module.LIMITATIONS,
            'threshold_origin':'Pre-registered conservative audit thresholds; not production gates or optimizer error bounds.',
            'script_sha256':hashlib.sha256(source.read_bytes()).hexdigest()}
          raw=module.encode(value)
          Path('audit-preregistration.json').write_bytes(raw)
          print(raw.decode());print('PREREGISTERED_SHA256='+hashlib.sha256(raw).hexdigest())
          PREREGISTER
      - name: 独立进程恢复精确状态（600秒含kill grace、无保存标记）
        id: restore
        continue-on-error: true
        run: |
          timeout --signal=TERM --kill-after=10s 590s python - <<'RESTORE_FIXED'
          from pathlib import Path
          import json,sys,time
          repo=Path('reader').resolve();runtime=Path('fixed-runtime').resolve()
          sys.path.insert(0,str(repo));sys.path.insert(0,str(repo/'scripts'))
          from scripts.fixed_fixture_validation_audit import restore_fixed
          import cloud_state
          state='49d58e87e4a4324039034f521ad7cba1a27349b0'
          started=time.monotonic()
          resources=restore_fixed(repo,runtime,state,cloud_state)
          value={'status':'restored_exact_state','state_commit':state,'runtime':str(runtime),
            'save_marker_created':False,'elapsed_seconds':time.monotonic()-started,'resources':resources,
            'reader_commit':cloud_state._git(repo,'rev-parse','HEAD').stdout.strip()}
          Path('audit-restore-receipt.json').write_text(json.dumps(value,indent=2)+'\n')
          print(json.dumps(value))
          RESTORE_FIXED
      - name: 全量已入模特征重建及3次真正独立R重拟（不重选参数、不写状态）
        id: audit
        if: ${{ steps.restore.outcome == 'success' }}
        continue-on-error: true
        run: >-
          timeout --signal=TERM --kill-after=10s 2090s
          python reader/scripts/fixed_research_deep_audit.py
          --numeric-repo original-numeric --runtime fixed-runtime
          --restore-receipt audit-restore-receipt.json --output audit-output
      - name: 仅有界验收回执和新的R数值结果（不上传原始API或冻结输入树）
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fixed-primeira-deep-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit-preregistration.json
            audit-restore-receipt.json
            audit-output/audit-*.json
          retention-days: 14
          if-no-files-found: warn
      - name: 真实失败或超时保持未完成，不重跑到通过
        if: ${{ !cancelled() && (steps.restore.outcome != 'success' || steps.audit.outcome != 'success') }}
        run: exit 1
