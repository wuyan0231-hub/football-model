name: 固定研究报告同池只读验收

on:
  push:
    branches: [codex/s3-fixed-research-audit-20261017]
    paths:
      - '.github/workflows/fixed-research-report-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fixed_research_audit:
    if: github.repository == 'wuyan0231-hub/football-model'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      FOOTBALL_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 原依赖与独立验收器安全回归
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p test_fixed_research_report_audit.py -v
      - name: 固定五联赛完整报告与同池评分（不重新拟合或保存状态）
        id: audit
        continue-on-error: true
        run: >-
          python scripts/fixed_research_report_audit.py --repo .
          --state-commit 459a6f1348d3d2df39f6b6843aae70c51c41026f
          --implementation 1e311689b3405f64c6ad9636732d2defb7ad67e26b4bc7e04b01a5b1b2b2d6ac
          --leagues epl,championship,laliga,bundesliga,serie_a
          --output fixed-research-report-audit.json
      - name: 仅有界数字回执（不上传内部完整单场包或API缓存）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fixed-research-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixed-research-report-audit.json
          retention-days: 14
          if-no-files-found: warn
      - name: 保留实际未完成或数值失败
        if: ${{ !cancelled() && steps.audit.outcome != 'success' }}
        run: exit 1
